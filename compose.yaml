services:
  app:
    build: .
    environment:
      DATABASE_PATH: /app/data/workspace.sqlite
      ASSET_DIRECTORY: /app/data/assets
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:?Run npm run setup first}
      APP_PASSWORD: ${APP_PASSWORD:?Run npm run setup first}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      - "${PUBLISH_HOST:-0.0.0.0}:${PORT:-3001}:3001"
    volumes:
      - workspace:/app/data
      - ./data/tls:/app/data/tls:ro
    restart: unless-stopped
volumes:
  workspace:
